# Robot Edge fixture mode - no hardware
version: '3.8'

services:
  robot-edge:
    build:
      context: ../..
      dockerfile: deploy/robot-edge/Dockerfile
    image: ubrobot/robot-edge:fixture
    container_name: ubrobot-robot-edge-fixture
    ports:
      - "8780:8780"
    environment:
      - UBROBOT_EDGE_MODE=fixture
      - UBROBOT_EDGE_HARDWARE_AUTHORITY=false
      - UBROBOT_EDGE_TOKENS_FILE=/app/config/tokens.json
      - UBROBOT_EDGE_REQUEST_MAX_AGE_SEC=300
      - UBROBOT_EDGE_NONCE_TTL_SEC=600
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8780/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
