services:
  # Go2+Piper hardware driver container (one robot = one hardware container).
  #
  # Hosts the Go2 bridge (guarded /cmd_vel -> Unitree DDS body) AND the Piper
  # arm driver (/piper/joint_cmd -> CAN JointCtrl/GripperCtrl). Both are the
  # robot's motion execution layer; the semantic layer (Cortex, grasp Action
  # server, motion arbitration) lives in the emos container and talks to this
  # container over ROS 2 topics/services.
  #
  # Task 1 finding (2026-08-07): the Go2 body talks Unitree private DDS over
  # CycloneDDS on eth0 (192.168.123.x); the host .bashrc already sets
  # RMW_IMPLEMENTATION=rmw_cyclonedds_cpp. Because the Go2 DDS transport is
  # CycloneDDS, ALL dock-side ROS 2 containers (this driver + the ubrobot
  # emos/navigation containers) must run rmw_cyclonedds_cpp on the same
  # ROS_DOMAIN_ID. The Pi/LeKiwi stack keeps rmw_fastrtps_cpp and is
  # unaffected (separate robot, separate domain).
  go2-piper-driver:
    image: ubrobot/go2-piper-driver:${GO2_PIPER_DRIVER_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/go2-piper-driver/Dockerfile
      args:
        ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-ros:jazzy-ros-base-noble}
    container_name: go2-piper-driver
    network_mode: host
    init: true
    stop_signal: SIGINT
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # Go2 DDS transport is CycloneDDS (Task 1 finding 3): this driver and
      # every dock-side ubrobot container MUST use rmw_cyclonedds_cpp so the
      # guarded /cmd_vel reaches the bridge on the same RMW + domain.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /etc/cyclonedds/cyclonedds.xml
      ROS_HOME: /tmp/ros-home
      ROS_LOG_DIR: /tmp/ros-logs
      # Go2 body is reachable on eth0 (192.168.123.18/24 -> 192.168.123.161).
      GO2_BRIDGE_INTERFACE: ${GO2_BRIDGE_INTERFACE:-eth0}
      GO2_BRIDGE_BODY_IP: ${GO2_BRIDGE_BODY_IP:-192.168.123.161}
      # Piper arm on the dock's CAN interface.
      PIPER_CAN_INTERFACE: ${PIPER_CAN_INTERFACE:-can0}
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    devices:
      # Piper arm CAN (socketcan). Map the CAN device into the container so
      # only this hardware container can touch the arm.
      - /dev/can0:/dev/can0
    security_opt:
      - no-new-privileges:true
    command:
      - ros2
      - launch
      - go2_launch
      - go2_piper_bringup.launch.py
    healthcheck:
      test: ["CMD", "ros2", "topic", "hz", "/odom", "--window", "5"]
      interval: 15s
      timeout: 15s
      retries: 6
      start_period: 30s
    stop_grace_period: 3s
