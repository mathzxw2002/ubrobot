# M6: Robot Edge read-only ROS profile.
#
# Serves capability/telemetry snapshots from the real ROS graph while every
# command endpoint rejects with "hardware authority disabled". No devices are
# mapped and no control topics are ever published by this profile.
#
# Use together with the base fixture compose file:
#   docker compose -f deploy/robot-edge/compose.fixture.yaml \
#                  -f deploy/robot-edge/compose.ros-readonly.yaml up
services:
  robot-edge:
    build:
      context: ../..
      dockerfile: deploy/robot-edge/Dockerfile.ros
    image: ubrobot/robot-edge:readonly-ros
    network_mode: host
    environment:
      - UBROBOT_EDGE_MODE=hardware
      - UBROBOT_EDGE_HARDWARE_AUTHORITY=false
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/fastdds/udp-only.xml
      - FASTDDS_DEFAULT_PROFILES_FILE=/etc/fastdds/udp-only.xml
      - UBROBOT_EDGE_TOKENS_FILE=/app/config/tokens.json
      # M7 physical E-stop binding. Enabled only after the owner wires and
      # verifies the NC auxiliary contact (ADR-0002). While disabled the
      # service reports local_stop.bound=false and may not claim hardware
      # authority (app-level fail-closed gate).
      - UBROBOT_EDGE_ESTOP_ENABLED=false
      - UBROBOT_EDGE_ESTOP_CHIP=gpiochip4
      - UBROBOT_EDGE_ESTOP_LINE=23
      - UBROBOT_EDGE_ESTOP_LINE_NAME=ubrobot-estop
      - UBROBOT_EDGE_ESTOP_DEBOUNCE_SEC=0.02
    volumes:
      - ../fastdds/udp-only.xml:/etc/fastdds/udp-only.xml:ro
      - ./config:/app/config:ro
    devices:
      # E-stop auxiliary contact via libgpiod (Raspberry Pi 5 exposes
      # gpiochip0..4). Map all five chips so the configured line resolves.
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
      - /dev/gpiochip2:/dev/gpiochip2
      - /dev/gpiochip3:/dev/gpiochip3
      - /dev/gpiochip4:/dev/gpiochip4
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8780/v1/health/live', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
