# HARD GATE: use this override only with the wheels lifted until motor IDs,
# wheel directions, feedback signs, watchdog, and stop behavior are verified.
services:
  lekiwi-base-driver:
    devices:
      - /dev/lekiwi-base:/dev/lekiwi-base
    command:
      - ros2
      - launch
      - lekiwi_bringup
      - lekiwi_driver.launch.py
      - hardware_mode:=real
      - enable_real_hardware:=true
