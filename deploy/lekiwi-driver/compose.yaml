services:
  lekiwi-base-driver:
    image: ubrobot/lekiwi-base-driver:${LEKIWI_DRIVER_TAG:-0.2.0}
    build:
      context: ../..
      dockerfile: deploy/lekiwi-driver/Dockerfile
      args:
        ROS_BASE_IMAGE: ros:jazzy-ros-base-noble
    container_name: lekiwi-base-driver
    network_mode: host
    init: true
    stop_signal: SIGINT
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      # Separate containers have private IPC namespaces. This explicit profile
      # disables builtin SHM and forces DDS over the shared host network.
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp-only.xml
      FASTDDS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp-only.xml
      ROS_HOME: /tmp/ros-home
      ROS_LOG_DIR: /tmp/ros-logs
    volumes:
      - ../fastdds/udp-only.xml:/etc/fastdds/udp-only.xml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - ros2
      - launch
      - lekiwi_bringup
      - lekiwi_driver.launch.py
      - hardware_mode:=mock
    healthcheck:
      test: ["CMD", "/usr/local/bin/lekiwi-healthcheck.sh"]
      interval: 15s
      timeout: 15s
      retries: 6
      start_period: 30s
    stop_grace_period: 3s
