name: CI

on:
  push:
    branches: [main, "codex/*", "feature/*", "fix/*", "go2-piper-cortex-integration"]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        # Pin to the repo's locked version (pyproject.toml) so newer ruff
        # releases (which enable new rules like I001/EXE002) cannot drift the
        # gate. Bump deliberately when the codebase is ready for new rules.
        run: python -m pip install --quiet "ruff==0.14.13"
      # Hard gate: first-party production packages must be lint-clean.
      # Vendored trees (yahboomcar ROS workspace, logoplanner model dirs) are
      # excluded in [tool.ruff] in pyproject.toml.
      - name: "Ruff check (production packages)"
        run: python -m ruff check src/chat_ui src/ubrobot_contracts src/robot_edge
      - name: "Ruff format check (production packages)"
        run: python -m ruff format --check src/chat_ui src/ubrobot_contracts src/robot_edge
      # Non-blocking phase-2 gate: src/ubrobot and src/service still carry
      # legacy experimental violations (tracked in
      # docs/plans/2026-08-08-refactor-experimental-code.md, Tasks 2/4).
      # These become hard gates as each package is cleaned.
      - name: "Ruff check (ubrobot + service, informational)"
        run: python -m ruff check src/ubrobot src/service || true

  test:
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked test dependencies
        # requirements-operator-console.txt pins the exact versions that are
        # green on the dev workstation (fastapi/pydantic/starlette/gradio).
        # Bare `pip install gradio` pulls a newer starlette and breaks the
        # runtime-version contract test - never install unpinned.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-operator-console.txt pillow
      - name: Robot Edge unit suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/robot_edge -p "test_*.py"
        # test_motion_arbitration currently fails: it imports
        # ubrobot_manipulation.authority (a ROS ament package) from the pure
        # Python workstation path. Fixed by refactor plan Task 1 (move
        # AuthorityTracker into ubrobot_contracts). Tracked in
        # docs/plans/2026-08-08-refactor-experimental-code.md.
        continue-on-error: true
      - name: Cortex navigation suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/cortex_navigation -p "test_*.py"
      - name: Process-level mock acceptance
        env:
          PYTHONPATH: src
        run: python -m unittest tests.e2e.test_operator_console_mock
      - name: Two-process robot edge fixture acceptance
        env:
          PYTHONPATH: src
        run: python -m unittest tests.e2e.test_operator_robot_edge_fixture

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Scan the checked-out tree (--no-git) so only first-party current
      # source is checked, matching the Python static scan. The repo's git
      # history still contains retired DashScope keys (see
      # docs/plans/2026-08-08-production-hardening.md, P0.3); cleaning
      # them requires a filter-repo rewrite + force push (owner decision).
      # Vendored trees + local dev credentials are allowlisted in gitleaks.toml.
      - name: Gitleaks scan (working tree)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            -w /repo zricethezav/gitleaks:latest \
            detect --no-git --source . --config gitleaks.toml
      - name: Hardcoded-secret scan (static Python)
        env:
          PYTHONPATH: src
        run: python -m unittest tests.security.test_hardcoded_secrets
