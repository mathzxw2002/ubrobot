services:
  # Go2 ROS 2 bridge (containerized on the Go2 expansion dock).
  #
  # Task 1 finding (2026-08-07): the Go2 body talks Unitree private DDS over
  # CycloneDDS on eth0 (192.168.123.x); the host .bashrc already sets
  # RMW_IMPLEMENTATION=rmw_cyclonedds_cpp. Because the Go2 DDS transport is
  # CycloneDDS, ALL dock-side ROS 2 containers (this bridge + the ubrobot
  # emos/navigation containers) must run rmw_cyclonedds_cpp on the same
  # ROS_DOMAIN_ID. The Pi/LeKiwi stack keeps rmw_fastrtps_cpp and is
  # unaffected (separate robot, separate domain).
  go2-bridge:
    image: ubrobot/go2-bridge:${GO2_BRIDGE_TAG:-0.1.0}
    build:
      context: ../..
      dockerfile: deploy/go2-driver/Dockerfile
      args:
        ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-ros:jazzy-ros-base-noble}
    container_name: go2-bridge
    network_mode: host
    init: true
    stop_signal: SIGINT
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # Go2 DDS transport is CycloneDDS (Task 1 finding 3): the bridge and
      # every dock-side ubrobot container MUST use rmw_cyclonedds_cpp so the
      # guarded /cmd_vel reaches the bridge on the same RMW + domain.
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /etc/cyclonedds/cyclonedds.xml
      ROS_HOME: /tmp/ros-home
      ROS_LOG_DIR: /tmp/ros-logs
      # Go2 body is reachable on eth0 (192.168.123.18/24 -> 192.168.123.161).
      GO2_BRIDGE_INTERFACE: ${GO2_BRIDGE_INTERFACE:-eth0}
      GO2_BRIDGE_BODY_IP: ${GO2_BRIDGE_BODY_IP:-192.168.123.161}
    volumes:
      - ./cyclonedds.xml:/etc/cyclonedds/cyclonedds.xml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - ros2
      - launch
      - go2_bringup
      - go2_bringup.launch.py
    healthcheck:
      test: ["CMD", "ros2", "topic", "hz", "/odom", "--window", "5"]
      interval: 15s
      timeout: 15s
      retries: 6
      start_period: 30s
    stop_grace_period: 3s
